[package]
name = "lune-std-js"
version = "0.4.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/lune-org/lune"
description = "Lune standard library - JavaScript"

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
async-io = "2.4"
futures = { version = "0.3", default-features = false, features = ["std"] }
futures-lite = "2.6"
mlua = { version = "0.12.2", features = ["luau", "async"] }
mlua-luau-scheduler = { version = "0.3.0", path = "../mlua-luau-scheduler" }
# Keep the transitive browser-targeting dependency on the repository's Rust 1.92 toolchain.
oxc-browserslist = "=3.0.8"
oxc_allocator = "=0.125.0"
oxc_ast = "=0.125.0"
oxc_ast_visit = "=0.125.0"
oxc_codegen = { version = "=0.125.0", features = ["sourcemap"] }
oxc_diagnostics = "=0.125.0"
oxc_parser = "=0.125.0"
oxc_semantic = "=0.125.0"
oxc_sourcemap = "6.0.1"
oxc_span = "=0.125.0"
oxc_str = "=0.125.0"
oxc_transformer = "=0.125.0"
rquickjs = { version = "0.14", features = ["futures", "loader"] }

lune-utils = { version = "0.4.0", path = "../lune-utils" }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "driver"
path = "tests/driver.rs"

[[test]]
name = "modules"
path = "tests/modules.rs"
