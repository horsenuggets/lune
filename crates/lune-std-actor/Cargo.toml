[package]
name = "lune-std-actor"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/lune-org/lune"
description = "Lune standard library - Actor"

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
mlua = { version = "0.12.2", features = ["luau"] }
mlua-luau-scheduler = { version = "0.4.0", path = "../mlua-luau-scheduler" }

async-channel = "2.3"
futures-lite = "2.6"

lune-utils = { version = "0.4.0", path = "../lune-utils" }

[dev-dependencies]
async-io = "2.4"
