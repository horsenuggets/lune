name: Release checks

on:
  pull_request:
    branches:
      - release

jobs:
  pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@v4

      - name: Check PR title format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: bash -e "$GITHUB_WORKSPACE/.github/workflows/helpers/check-pr-title-format.sh"

  diff-check:
    name: Verify diff matches main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check diff with main
        run: bash -e "$GITHUB_WORKSPACE/.github/workflows/helpers/check-diff-with-main.sh"

  version:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version file exists
        run: bash -e "$GITHUB_WORKSPACE/.github/workflows/helpers/check-version-file-exists.sh"

      - name: Check version bump
        run: bash -e "$GITHUB_WORKSPACE/.github/workflows/helpers/check-version-bump.sh"

      - name: Check changelog entry
        run: bash -e "$GITHUB_WORKSPACE/.github/workflows/helpers/check-changelog-entry.sh"

      - name: Verify PR title matches VERSION
        env:
          ACTUAL_TITLE: ${{ github.event.pull_request.title }}
        run: bash -e "$GITHUB_WORKSPACE/.github/workflows/helpers/verify-pr-title-matches-version.sh"

      - name: Check Cargo.toml version matches
        run: bash -e "$GITHUB_WORKSPACE/.github/workflows/helpers/check-cargo-toml-version-matches.sh"

  build-test:
    name: Build test - ${{ matrix.name }}
    runs-on: ${{ matrix.runner-os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner-os: windows-2022
            cargo-target: x86_64-pc-windows-msvc

          - name: Windows arm64
            runner-os: windows-11-arm
            cargo-target: aarch64-pc-windows-msvc

          - name: Linux x64
            runner-os: ubuntu-22.04
            cargo-target: x86_64-unknown-linux-gnu

          - name: Linux arm64
            runner-os: ubuntu-22.04-arm
            cargo-target: aarch64-unknown-linux-gnu

          - name: macOS x64
            runner-os: macos-15
            cargo-target: x86_64-apple-darwin

          - name: macOS arm64
            runner-os: macos-15
            cargo-target: aarch64-apple-darwin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cargo-target }}

      - name: Build
        run: cargo build --release --locked --all-features --target ${{ matrix.cargo-target }}
