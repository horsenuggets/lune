name: Release

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  init:
    name: Init
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.value }}
      changelog: ${{ steps.get_changelog.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from VERSION file
        id: get_version
        run: bash --noprofile --norc -e -o pipefail "$GITHUB_WORKSPACE/.github/workflows/helpers/get-version-from-version-file.sh"

      - name: Extract changelog for this version
        id: get_changelog
        run: bash --noprofile --norc -e -o pipefail "$GITHUB_WORKSPACE/.github/workflows/helpers/extract-changelog-for-this-version.sh"

  dry-run:
    name: Dry-run
    needs: ["init"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish (dry-run)
        if: github.repository == 'lune-org/lune'
        uses: katyo/publish-crates@v2
        with:
          dry-run: true
          check-repo: true
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build:
    needs: ["init", "dry-run"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner-os: windows-2022
            artifact-name: lune-${{ needs.init.outputs.version }}-windows-x64
            cargo-target: x86_64-pc-windows-msvc

          - name: Windows arm64
            runner-os: windows-11-arm
            artifact-name: lune-${{ needs.init.outputs.version }}-windows-arm64
            cargo-target: aarch64-pc-windows-msvc

          - name: Linux x64
            runner-os: ubuntu-22.04
            artifact-name: lune-${{ needs.init.outputs.version }}-linux-x64
            cargo-target: x86_64-unknown-linux-gnu

          - name: Linux arm64
            runner-os: ubuntu-22.04-arm
            artifact-name: lune-${{ needs.init.outputs.version }}-linux-arm64
            cargo-target: aarch64-unknown-linux-gnu

          - name: macOS x64
            runner-os: macos-15
            artifact-name: lune-${{ needs.init.outputs.version }}-macos-x64
            cargo-target: x86_64-apple-darwin

          - name: macOS arm64
            runner-os: macos-15
            artifact-name: lune-${{ needs.init.outputs.version }}-macos-arm64
            cargo-target: aarch64-apple-darwin

    name: Build - ${{ matrix.name }}
    runs-on: ${{ matrix.runner-os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cargo-target }}

      - name: Build binary
        env:
          WORKFLOW_MATRIX_CARGO_TARGET: ${{ matrix.cargo-target }}
        run: bash --noprofile --norc -e -o pipefail "$GITHUB_WORKSPACE/.github/workflows/helpers/build-binary.sh"

      - name: Create release archive
        run: ./scripts/zip-release.sh ${{ matrix.cargo-target }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: release.zip

  release-github:
    name: Release (GitHub)
    runs-on: ubuntu-latest
    needs: ["init", "dry-run", "build"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download releases
        uses: actions/download-artifact@v4
        with:
          path: ./releases

      - name: Unpack releases
        run: ./scripts/unpack-releases.sh "./releases"

      - name: Write changelog to file
        env:
          WORKFLOW_NEEDS_INIT_OUTPUTS_CHANGELOG: ${{ needs.init.outputs.changelog }}
        run: bash --noprofile --norc -e -o pipefail "$GITHUB_WORKSPACE/.github/workflows/helpers/write-changelog-to-file.sh"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NEEDS_INIT_OUTPUTS_VERSION: ${{ needs.init.outputs.version }}
        run: bash --noprofile --norc -e -o pipefail "$GITHUB_WORKSPACE/.github/workflows/helpers/create-release.sh"

  release-crates:
    if: github.repository == 'lune-org/lune'
    name: Release (crates.io)
    runs-on: ubuntu-latest
    needs: ["init", "dry-run", "build"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crates
        uses: katyo/publish-crates@v2
        with:
          dry-run: false
          check-repo: true
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
